<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHP2Shell — Submit</title>
<style>
  :root{
    --bg:#0b1020;--panel:#0f1830;--panel-2:#101b36;--line:#1f2c4d;
    --indigo:#4f46e5;--violet:#8b5cf6;--amber:#f5b942;--red:#ef5a6f;--green:#3ddc84;
    --text:#e7edff;--text-dim:#7f8bb3;
    --mono:"IBM Plex Mono","Courier New",monospace;--sans:"Inter","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--bg);background-image:
      radial-gradient(circle at 15% 0%, rgba(79,70,229,0.16), transparent 42%),
      radial-gradient(circle at 85% 8%, rgba(139,92,246,0.12), transparent 45%);
    color:var(--text);font-family:var(--sans);min-height:100vh;}
  .wrap{max-width:900px;margin:0 auto;padding:40px 24px 90px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:28px;gap:16px;flex-wrap:wrap;}
  .brand{font-size:26px;font-weight:800;letter-spacing:-0.5px;}
  .brand .x{color:var(--violet);}
  .brand-sub{font-family:var(--mono);font-size:12px;color:var(--text-dim);margin-top:4px;}
  .brand-sub .cat{color:var(--indigo);}
  .chip{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-family:var(--mono);font-size:13px;}
  .scorebox{background:linear-gradient(135deg,var(--indigo),var(--violet));border-radius:12px;padding:14px 22px;display:flex;align-items:center;gap:14px;margin-bottom:26px;}
  .scorebox .lbl{font-family:var(--mono);font-size:11px;letter-spacing:1.2px;color:rgba(255,255,255,.8);text-transform:uppercase;}
  .scorebox .val{font-family:var(--mono);font-size:30px;font-weight:700;}
  .scorebox .max{font-family:var(--mono);font-size:13px;color:rgba(255,255,255,.75);}
  .q-card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:22px 24px;margin-bottom:16px;display:flex;gap:18px;align-items:flex-start;}
  .q-card.correct{border-color:var(--green);box-shadow:0 0 0 1px rgba(61,220,132,.25) inset;}
  .q-card.incorrect{border-color:var(--red);}
  .q-badge{flex:none;width:50px;height:50px;border-radius:12px;background:linear-gradient(135deg,var(--indigo),#312e81);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;}
  .q-card.correct .q-badge{background:linear-gradient(135deg,var(--green),#1f9d5c);}
  .q-body{flex:1;min-width:0;}
  .q-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:10px;}
  .q-of{font-family:var(--mono);color:var(--text-dim);font-size:12.5px;}
  .q-points{font-family:var(--mono);font-size:12.5px;font-weight:700;color:#1a1420;background:var(--amber);border-radius:7px;padding:4px 10px;white-space:nowrap;}
  .q-text{font-size:15.5px;font-weight:700;margin-bottom:14px;line-height:1.45;}
  .q-row{display:flex;gap:10px;flex-wrap:wrap;}
  .q-input{flex:1;min-width:220px;background:#0a1226;border:1px solid var(--line);border-radius:9px;color:var(--text);font-family:var(--mono);font-size:14px;padding:12px 14px;}
  .q-input::placeholder{color:#4e5a80;} .q-input:focus{outline:none;border-color:var(--violet);} .q-input:disabled{color:var(--text-dim);}
  .check-btn{background:var(--violet);border:none;border-radius:9px;color:#fff;font-weight:700;font-size:13px;letter-spacing:.4px;padding:12px 22px;cursor:pointer;}
  .check-btn:hover{filter:brightness(1.12);} .check-btn:disabled{opacity:.35;cursor:default;}
  .q-feedback{font-size:12.5px;margin-top:10px;min-height:16px;font-weight:600;}
  .q-feedback.ok{color:var(--green);} .q-feedback.bad{color:var(--red);}
  .hint{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:8px;}
  #submit-row{text-align:center;margin-top:24px;}
  .action-btn{background:linear-gradient(135deg,var(--indigo),var(--violet));color:#fff;border:none;border-radius:10px;font-weight:700;font-size:15px;padding:15px 38px;cursor:pointer;}
  .action-btn:hover{filter:brightness(1.1);}
  #results{display:none;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:36px 30px;text-align:center;margin-top:10px;}
  #results.live{display:block;}
  #results h2{font-size:20px;margin:0 0 6px;}
  .score-big{font-family:var(--mono);font-size:50px;font-weight:800;background:linear-gradient(135deg,var(--indigo),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;margin:12px 0;}
  .breakdown{font-family:var(--mono);font-size:13px;color:var(--text-dim);line-height:1.9;text-align:left;max-width:340px;margin:0 auto 22px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 4px;}
  .breakdown span{color:var(--text);font-weight:700;}
  footer{margin-top:44px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--text-dim);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="brand">PHP2Shell<span class="x"> // submit</span></div>
      <div class="brand-sub">CATEGORY: <span class="cat">WEB EXPLOITATION &amp; RUNTIME RCE</span></div>
    </div>
    <div class="chip"><span id="session-id">session: ----</span></div>
  </div>

  <div class="scorebox">
    <div><div class="lbl">Score</div><div class="val" id="live-score">0</div></div>
    <div class="max">/ 100</div>
  </div>

  <div id="quiz"></div>

  <div id="submit-row"><button class="action-btn" id="finish-btn">Finish &amp; show score</button></div>

  <div id="results">
    <h2>&#127942; Submission closed</h2>
    <div class="score-big" id="final-score">0</div>
    <div class="breakdown" id="breakdown"></div>
    <button class="action-btn" id="reset-btn">Start again</button>
  </div>

  <footer>PHP2Shell lab · client-side submission · answers verified by SHA-256 hash, no backend</footer>
</div>

<script>
(function(){
  const QUESTIONS = [
    { id:"Q1", points:20, text:"What is the default name of the form field that switches on PHP's upload-progress tracking?", hint:"UPPER_SNAKE_CASE constant" },
    { id:"Q2", points:20, text:"What one-word name does the PHP engine give to the longjmp it performs to abort a request that hits a fatal error (such as running out of memory)?", hint:"one word" },
    { id:"Q3", points:20, text:"What is the version of PHP running on the target?", hint:"x.y.z" },
    { id:"Q4", points:40, text:"Exploit the site and submit the flag.", hint:"FLAG{...}" }
  ];
  // Answers are hashed at load; plaintext references are dropped.
  const RAW = [
    "PHP_SESSION_UPLOAD_PROGRESS",
    "bailout",
    "8.4.26",
    "FLAG{PHP_1SN'T_S4F3_4NYM0R3}"
  ];

  function normalize(s){ return s.trim().toLowerCase().replace(/\s+/g,""); }
  async function sha256(s){
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  let ready=false;
  (async()=>{ for(let i=0;i<QUESTIONS.length;i++){ QUESTIONS[i].hash=await sha256(normalize(RAW[i])); RAW[i]=null; } ready=true; })();

  const answered={};
  const el={ quiz:document.getElementById("quiz"), live:document.getElementById("live-score"),
    finish:document.getElementById("finish-btn"), results:document.getElementById("results"),
    final:document.getElementById("final-score"), breakdown:document.getElementById("breakdown"),
    reset:document.getElementById("reset-btn"), sid:document.getElementById("session-id"),
    submitRow:document.getElementById("submit-row") };
  const MAX = QUESTIONS.reduce((s,q)=>s+q.points,0);
  function score(){ return Object.values(answered).reduce((s,a)=>s+a.pts,0); }

  function build(){
    el.quiz.innerHTML="";
    QUESTIONS.forEach((q,i)=>{
      const c=document.createElement("div"); c.className="q-card"; c.id="card-"+q.id;
      c.innerHTML=`<div class="q-badge">${q.id}</div><div class="q-body">
        <div class="q-top"><span class="q-of">${i+1} of ${QUESTIONS.length}</span><span class="q-points">${q.points} pts</span></div>
        <div class="q-text">${q.text}</div>
        <div class="q-row"><input class="q-input" id="in-${q.id}" autocomplete="off" placeholder="type your answer..."><button class="check-btn" id="ck-${q.id}">CHECK</button></div>
        <div class="hint">format: ${q.hint}</div>
        <div class="q-feedback" id="fb-${q.id}"></div></div>`;
      el.quiz.appendChild(c);
    });
    QUESTIONS.forEach(q=>{
      document.getElementById("ck-"+q.id).addEventListener("click",()=>check(q));
      document.getElementById("in-"+q.id).addEventListener("keydown",e=>{ if(e.key==="Enter") check(q); });
    });
  }

  async function check(q){
    if(answered[q.id]&&answered[q.id].correct) return;
    const input=document.getElementById("in-"+q.id), fb=document.getElementById("fb-"+q.id), card=document.getElementById("card-"+q.id);
    if(!ready){ fb.textContent="initialising — try again in a moment."; fb.className="q-feedback bad"; return; }
    const v=normalize(input.value);
    if(!v){ fb.textContent="enter an answer first."; fb.className="q-feedback bad"; return; }
    const ok=(await sha256(v))===q.hash;
    if(ok){
      answered[q.id]={correct:true,pts:q.points};
      fb.textContent=`correct — +${q.points} pts`; fb.className="q-feedback ok";
      card.classList.remove("incorrect"); card.classList.add("correct");
      input.disabled=true; document.getElementById("ck-"+q.id).disabled=true;
    } else {
      answered[q.id]=answered[q.id]||{correct:false,pts:0};
      fb.textContent="not quite — try again."; fb.className="q-feedback bad"; card.classList.add("incorrect");
    }
    el.live.textContent=score();
  }

  function finish(){
    const total=score();
    QUESTIONS.forEach(q=>{ const i=document.getElementById("in-"+q.id),b=document.getElementById("ck-"+q.id); if(i)i.disabled=true; if(b)b.disabled=true; });
    el.submitRow.style.display="none"; el.quiz.style.display="none"; el.results.classList.add("live");
    el.final.textContent=total;
    const solved=QUESTIONS.filter(q=>answered[q.id]&&answered[q.id].correct).length;
    el.breakdown.innerHTML=`questions solved: <span>${solved} / ${QUESTIONS.length}</span><br>points: <span>${total} / ${MAX}</span><br>result: <span>${total===MAX?"FULL MARKS":total>=60?"PASS":"KEEP GOING"}</span>`;
    try{ const k="php2shell_scores"; const a=JSON.parse(localStorage.getItem(k)||"[]"); a.push({score:total,session:el.sid.textContent.replace("session: ",""),at:new Date().toISOString()}); localStorage.setItem(k,JSON.stringify(a)); }catch(e){}
  }
  function reset(){ Object.keys(answered).forEach(k=>delete answered[k]); el.results.classList.remove("live"); el.quiz.style.display="block"; el.submitRow.style.display="block"; el.live.textContent="0"; build(); }

  el.finish.addEventListener("click",finish);
  el.reset.addEventListener("click",reset);
  el.sid.textContent="session: "+Math.random().toString(36).slice(2,10);
  build();
})();
</script>
</body>
</html>
